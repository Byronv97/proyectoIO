<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <rect width="800" height="520" fill="#ffffff"/>
  <text x="400" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937">Región factible y solución óptima</text>

  <polygon points="80,450 480,450 380,362 230,274 80,216" fill="#2f7f75" fill-opacity="0.2" stroke="#2f7f75" stroke-width="2"/>

  <line x1="80" y1="450" x2="680" y2="450" stroke="#1f2937" stroke-width="2"/>
  <line x1="80" y1="450" x2="80" y2="40" stroke="#1f2937" stroke-width="2"/>

  <line x1="80" y1="216" x2="680" y2="450" stroke="#3b82f6" stroke-width="2"/>
  <line x1="80" y1="99" x2="480" y2="450" stroke="#ef4444" stroke-width="2"/>
  <line x1="80" y1="186" x2="530" y2="450" stroke="#8b5cf6" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="12" fill="#374151">
    <text x="76" y="466" text-anchor="end">0</text>
    <text x="230" y="466" text-anchor="middle">15</text>
    <text x="380" y="466" text-anchor="middle">30</text>
    <text x="480" y="466" text-anchor="middle">40</text>
    <text x="680" y="466" text-anchor="middle">60</text>
    <text x="68" y="454" text-anchor="end">0</text>
    <text x="68" y="366" text-anchor="end">15</text>
    <text x="68" y="278" text-anchor="end">30</text>
    <text x="68" y="220" text-anchor="end">40</text>
    <text x="68" y="103" text-anchor="end">60</text>
    <text x="400" y="492" text-anchor="middle" font-size="14">Lotes de galletas (x)</text>
    <text x="18" y="245" text-anchor="middle" font-size="14" transform="rotate(-90 18 245)">Lotes de cupcakes (y)</text>
  </g>

  <g fill="#1f2937" font-family="Arial, sans-serif" font-size="12">
    <circle cx="480" cy="450" r="4"/>
    <circle cx="380" cy="362" r="4"/>
    <circle cx="230" cy="274" r="6" fill="#e07a5f"/>
    <circle cx="80" cy="216" r="4"/>
