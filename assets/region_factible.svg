  </g>

  <g font-family="Arial, sans-serif" font-size="12">
    <line x1="520" y1="55" x2="545" y2="55" stroke="#3b82f6" stroke-width="2"/>
    <text x="552" y="59" fill="#374151">Harina: 2x + 3y ≤ 120</text>
    <line x1="520" y1="78" x2="545" y2="78" stroke="#ef4444" stroke-width="2"/>
    <text x="552" y="82" fill="#374151">Mano de obra: 3x + 2y ≤ 120</text>
    <line x1="520" y1="101" x2="545" y2="101" stroke="#8b5cf6" stroke-width="2"/>
    <text x="552" y="105" fill="#374151">Capacidad: x + y ≤ 45</text>
  </g>
